name: Deploy site

on:
  push:
    branches: [main]
  schedule:
    # Once a day, to pick up new Substack essays.
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # New essays are fetched at build time. If Substack is unreachable, the committed copy is used.
      - name: Fetch new essays
        continue-on-error: true
        run: |
          npm run posts
          pip install --quiet pillow
          python3 scripts/optimize-images.py
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
